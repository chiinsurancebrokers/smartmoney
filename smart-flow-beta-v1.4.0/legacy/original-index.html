body.light .pill-purple{background:#f5eeff;color:#7733cc;border-color:#ddc8ff;}
body.light .pill-cyan{background:#e6f7ff;color:#0077aa;border-color:#b3e8ff;}

body.light .sp-bull{background:#e8fff5;color:#007a4d;}
body.light .sp-warn{background:#fff8e6;color:#b87800;}
body.light .sp-whale{background:#e6f7ff;color:#0077aa;}

*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:12px;min-height:100vh;}
button,input,select{font-family:var(--font);}
::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-track{background:var(--bg);} ::-webkit-scrollbar-thumb{background:var(--border3);}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:200;}
.logo{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--amber);}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;}
.dot-green{background:var(--green);animation:pulse 2s infinite;}
.dot-red{background:var(--red);}
.dot-amber{background:var(--amber);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tb-pill{font-size:9px;padding:2px 7px;border-radius:2px;letter-spacing:.05em;border:1px solid;}
.pill-green{background:#001a0a;color:var(--green);border-color:#003318;}
.pill-amber{background:#1a0f00;color:var(--amber);border-color:#332200;}
.pill-red{background:#1a0000;color:var(--red);border-color:#330000;}
.pill-blue{background:#000e1a;color:var(--blue);border-color:#001833;}
.pill-purple{background:#0d0018;color:var(--purple);border-color:#1a0033;}
.pill-cyan{background:#001a1a;color:var(--cyan);border-color:#003333;}

.warn-bar{background:#1a0000;border:1px solid var(--red);color:var(--red);padding:3px 10px;font-size:10px;border-radius:3px;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);}
.tab{padding:8px 14px;font-size:10px;letter-spacing:.1em;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 1fr 1fr 300px;gap:1px;background:var(--border);min-height:calc(100vh - 80px);}
.panel{background:var(--bg);padding:11px;overflow-y:auto;}
.panel.full{grid-column:1/5;}
.panel.two{grid-column:span 2;}
.panel.three{grid-column:span 3;}
.sidebar{background:var(--bg2);padding:11px;overflow-y:auto;max-height:calc(100vh - 80px);}

.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--border2);}
.pt{font-size:9px;letter-spacing:.2em;color:var(--muted);}

/* TICKER CARDS */
.tcard{background:var(--bg2);border:1px solid var(--border2);border-radius:3px;padding:10px;margin-bottom:7px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s;}
.tcard:hover{border-color:var(--amber);}
.tcard.div-signal{border-color:var(--purple);}
.tcard.whale-signal{border-color:var(--cyan);}
.tcard-badge{position:absolute;top:0;right:0;font-size:8px;font-weight:700;padding:2px 6px;letter-spacing:.1em;}
.badge-div{background:var(--purple);color:#000;}
.badge-whale{background:var(--cyan);color:#000;}
.badge-bull{background:var(--green);color:#000;}
.badge-bear{background:var(--red);color:#fff;}

.trow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.tname{font-size:15px;font-weight:700;}
.tname.bull{color:var(--green);}
.tname.bear{color:var(--red);}
.tprice{font-size:20px;font-weight:700;}
.tchange{font-size:11px;margin-left:6px;}
.up{color:var(--green);}
.down{color:var(--red);}
.neutral{color:var(--muted);}

.tmeta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-top:6px;}
.ml{font-size:8px;color:var(--muted);letter-spacing:.08em;}
.mv{font-size:10px;}

.fbar{display:flex;align-items:center;gap:5px;margin-top:7px;}
.fl{font-size:8px;color:var(--muted);width:26px;}
.ft{flex:1;height:3px;background:var(--border2);border-radius:2px;overflow:hidden;}
.ff-put{height:100%;background:var(--red);border-radius:2px;}
.ff-call{height:100%;background:var(--green);border-radius:2px;}
.fp{font-size:9px;width:26px;text-align:right;}

.srow{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;}
.sp{font-size:8px;padding:2px 5px;border-radius:2px;font-weight:600;}
.sp-bear{background:#1a0000;color:var(--red);}
.sp-bull{background:#001a0a;color:var(--green);}
.sp-warn{background:#1a0f00;color:var(--amber);}
.sp-whale{background:#001a1a;color:var(--cyan);}
.sp-div{background:#0d0018;color:var(--purple);}

/* FLOW TABLE */
.ftable{width:100%;border-collapse:collapse;}
.ftable th{font-size:8px;letter-spacing:.1em;color:var(--muted);text-align:left;padding:4px 5px;border-bottom:1px solid var(--border2);font-weight:400;}
.ftable td{padding:5px 5px;font-size:10px;border-bottom:1px solid var(--border);}
.ftable tr:hover td{background:var(--bg2);}
.type-put{color:var(--red);font-weight:700;}
.type-call{color:var(--green);font-weight:700;}
.side-ask{color:var(--red);}
.side-bid{color:var(--green);}

.sent-bear{color:var(--red);}
.sent-bull{color:var(--green);}
.prem{color:var(--amber);}
.star{color:var(--purple);font-weight:700;}

/* BUFFETT SCANNER */
.bitem{background:var(--bg2);border:1px solid var(--border2);border-radius:3px;padding:9px;margin-bottom:6px;display:flex;align-items:flex-start;gap:8px;}
.bicon{font-size:16px;flex-shrink:0;margin-top:1px;}
.bticker{font-size:13px;font-weight:700;color:var(--amber);}
.bprice{font-size:12px;color:var(--text);margin-left:6px;}
.btag{font-size:8px;padding:2px 5px;border-radius:2px;margin-left:4px;}
.btag-insider{background:#001a1a;color:var(--cyan);border:1px solid #002a2a;}
.btag-whale{background:#0d0018;color:var(--purple);border:1px solid #1a0033;}
.btag-congress{background:#1a0f00;color:var(--amber);border:1px solid #2a1800;}
.btag-vol{background:#001a0a;color:var(--green);border:1px solid #003318;}
.btag-unver{background:#1a1a00;color:#aaaa00;border:1px solid #333300;font-size:7px;}
.bdesc{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.5;}
.bwatch{background:transparent;border:1px solid var(--border3);color:var(--muted);font-size:9px;padding:3px 8px;border-radius:2px;cursor:pointer;margin-top:5px;transition:all .15s;}
.bwatch:hover{border-color:var(--amber);color:var(--amber);}
.bwatch.watching{border-color:var(--green);color:var(--green);}

/* AI PANEL */
.ai-output{font-size:10px;line-height:1.7;color:var(--text);white-space:pre-wrap;background:var(--bg2);border:1px solid var(--border2);border-radius:3px;padding:12px;min-height:120px;}
.ai-loading{display:flex;align-items:center;gap:8px;color:var(--amber);font-size:10px;padding:20px;}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 1s infinite;}
.ai-dot:nth-child(2){animation-delay:.2s;}
.ai-dot:nth-child(3){animation-delay:.4s;}

/* SIDEBAR */
.sbox{background:var(--bg3);border:1px solid var(--border2);border-radius:3px;padding:10px;margin-bottom:8px;}
.stitle{font-size:8px;letter-spacing:.18em;color:var(--muted);margin-bottom:8px;text-transform:uppercase;}

.compound-num{font-size:26px;font-weight:700;color:var(--green);}
.cprog{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-top:8px;}
.cpfill{height:100%;background:linear-gradient(90deg,var(--green),var(--amber));border-radius:2px;transition:width .5s;}
.csteps{display:flex;justify-content:space-between;margin-top:4px;font-size:8px;color:var(--muted);}
.csdone{color:var(--green);}

.tform{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.tform select,.tform input{background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:10px;padding:5px 6px;border-radius:2px;outline:none;width:100%;}

.tform-full{grid-column:1/3;}
.btn-log{grid-column:1/3;background:#1a0f00;border:1px solid var(--amber);color:var(--amber);font-family:var(--font);font-size:9px;padding:6px;border-radius:2px;cursor:pointer;letter-spacing:.12em;transition:background .15s;}

.pnl-big{font-size:24px;font-weight:700;}
.pnl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
.pstat-l{font-size:8px;color:var(--muted);}

.tlog-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:10px;}

.alert-item.div{border-left-color:var(--purple);}

.overnight-box{background:#1a0000;border:1px solid var(--red);border-radius:3px;padding:9px;margin-bottom:8px;}

.ow-msg{font-size:9px;color:#ff8888;line-height:1.5;}

/* BUTTONS */
.btn{background:transparent;border:1px solid var(--border3);color:var(--muted);font-family:var(--font);font-size:9px;padding:3px 9px;border-radius:2px;cursor:pointer;transition:all .15s;letter-spacing:.08em;}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn-primary{background:#1a0f00;border-color:var(--amber);color:var(--amber);}
.btn-primary:hover{background:#2a1800;}
.btn-ai{background:#0d0018;border-color:var(--purple);color:var(--purple);}
.btn-ai:hover{background:#1a0033;}

.divider{height:1px;background:var(--border);margin:8px 0;}
.section-lbl{font-size:8px;letter-spacing:.2em;color:var(--dim);margin-bottom:5px;text-transform:uppercase;}

/* PREMARKET */
.pm-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);}
.pm-item:last-child{border-bottom:none;}
.pm-tick{font-size:12px;font-weight:700;color:var(--amber);width:48px;}

/* INPUT ROW */
.add-row{display:flex;gap:6px;margin-bottom:10px;}

.etoro-note{font-size:8px;color:var(--muted);background:var(--bg3);border:1px solid var(--border2);border-radius:2px;padding:5px 8px;line-height:1.5;}

/* BIG MOVE */
.bm-bar{height:5px;background:var(--border2);border-radius:3px;position:relative;overflow:hidden;}
.bm-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;}

/* SCANNER CONTROLS */
.scan-controls{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.scan-controls input{background:var(--bg2);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:10px;padding:4px 8px;border-radius:2px;outline:none;width:80px;}

/* TRIAL REMINDER */
.trial-bar{background:#1a0f00;border-bottom:1px solid var(--amber);padding:4px 14px;font-size:9px;color:var(--amber);display:flex;align-items:center;justify-content:space-between;}

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ==================== CONSTANTS ====================
const TD_KEY = window._TD_KEY || '';
const DEFAULT_TICKERS = ['SOXL','SOXS','NAIL','TQQQ','QQQ','SPY','VOO','PLUG','MBLY','SOXS'];
const STEPS = [16, 27.2, 46.2, 78.5, 133.5, 227, 386, 500, 1000, 2000, 4000, 8000, 16000];

// ==================== HELPERS ====================
const fmt = (n, d=2) => n == null ? '—' : Number(n).toFixed(d);
const fmtK = v => v >= 1000000 ? `$${(v/1000000).toFixed(1)}M` : v >= 1000 ? `$${(v/1000).toFixed(0)}K` : `$${v}`;
const now_gr = () => new Date().toLocaleTimeString('el-GR',{timeZone:'Europe/Athens',hour12:false});
const now_et = () => new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York',hour12:false});

function isMarketOpen() {
  const now = new Date();
  const et = new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  const h = et.getHours(), m = et.getMinutes(), day = et.getDay();
  if (day === 0 || day === 6) return false;
  const tot = h * 60 + m;
  return tot >= 570 && tot < 960; // 9:30–16:00 ET
}

function minsToClose() {
  const now = new Date();
  const gr = new Date(now.toLocaleString('en-US',{timeZone:'Europe/Athens'}));
  const tot = gr.getHours() * 60 + gr.getMinutes();
  const close = 23 * 60;
  return Math.max(0, close - tot);
}

function detectFlowSide(trade) {
  if (trade.is_ask_side === true) return 'ASK';
  if (trade.is_ask_side === false) return 'BID';
  const s = (trade.side || trade.action || trade.transaction_side || '').toLowerCase();
  if (s === 'ask' || s === 'buy' || s === 'bought') return 'ASK';
  if (s === 'bid' || s === 'sell' || s === 'sold') return 'BID';
  const sent = (trade.sentiment || '').toLowerCase();
  if (sent === 'bullish') return trade.put_call === 'PUT' ? 'BID' : 'ASK';
  if (sent === 'bearish') return trade.put_call === 'PUT' ? 'ASK' : 'BID';
  return 'MID';
}

function getSentiment(trade) {
  const side = detectFlowSide(trade);
  const type = (trade.put_call || trade.option_type || '').toUpperCase();
  if (type === 'CALL' && side === 'ASK') return 'BULLISH';
  if (type === 'CALL' && side === 'BID') return 'BEARISH';
  if (type === 'PUT' && side === 'ASK') return 'BEARISH';
  if (type === 'PUT' && side === 'BID') return 'BULLISH';
  return 'NEUTRAL';
}

// ==================== API CALLS ====================
async function fetchTDQuote(ticker) {
  if (!TD_KEY) return null;
  try {
    const r = await fetch(`https://api.twelvedata.com/quote?symbol=${ticker}&apikey=${TD_KEY}`);
    const d = await r.json();
    return d;
  } catch { return null; }
}

function extractOpenAIText(data) {
  if (!data) return '';
  if (typeof data.output_text === 'string' && data.output_text.trim()) return data.output_text.trim();
  const parts = [];
  (data.output || []).forEach(item => {
    (item.content || []).forEach(content => {
      if (content.type === 'output_text' && content.text) parts.push(content.text);
    });
  });
  return parts.join('\n').trim();
}

async function callClaude(prompt, maxTokens=4000, systemPrompt='') {
  const key = window._CLAUDE_KEY || '';
  const model = window._CLAUDE_MODEL || 'claude-sonnet-4-6';
  if (!key) throw new Error('Δεν έχει οριστεί Claude API key.');

  const body = {
    model,
    max_tokens: maxTokens,
    messages: [{ role: 'user', content: prompt }]
  };
  if (systemPrompt) body.system = systemPrompt;

  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify(body)
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) throw new Error(d?.error?.message || `Claude HTTP ${r.status}`);
  return d?.content?.filter(x => x.type === 'text').map(x => x.text).join('\n').trim() || '—';
}

async function callOpenAI(prompt, maxTokens=3500, instructions='') {
  const key = window._OPENAI_KEY || '';
  const model = window._OPENAI_MODEL || 'gpt-5.2';

  let r;
  try {
    r = await fetch('/.netlify/functions/openai-proxy', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(key ? {'X-OpenAI-Key': key} : {}),
      },
      body: JSON.stringify({
        model,
        instructions: instructions || undefined,
        input: prompt,
        max_output_tokens: Math.max(100, Number(maxTokens) || 3500),
      })
    });
  } catch (error) {
    throw new Error(`Αποτυχία σύνδεσης με το Netlify OpenAI proxy: ${error.message}`);
  }

  const d = await r.json().catch(() => ({}));
  if (r.status === 404) {
    throw new Error('Δεν βρέθηκε η Netlify Function openai-proxy. Ανέβασε ολόκληρο το ZIP και όχι μόνο το index.html.');
  }
  if (!r.ok || d.error) {
    const detail = d?.error?.message || d?.message || `OpenAI proxy HTTP ${r.status}`;
    throw new Error(detail);
  }
  const text = extractOpenAIText(d);
  if (!text) throw new Error('Το OpenAI API δεν επέστρεψε κείμενο. Δοκίμασε μεγαλύτερο max output ή άλλο διαθέσιμο model.');
  return text;
}

function BarchartImport({ onImport, onAddAlert }) {
  const [status, setStatus] = useState('');
  const [expanded, setExpanded] = useState(true);
  const [dragging, setDragging] = useState(false);
  const [parsing, setParsing] = useState(false);
  const [aiAnalysis, setAiAnalysis] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const [parsedRows, setParsedRows] = useState([]);
  const [summary, setSummary] = useState(null);
  const dropRef = useRef(null);

  function parseCSV(text, filename) {
    setParsing(true);
    try {
      const lines = text.split('\n').filter(l => l.trim() && !l.includes('Downloaded from Barchart'));
      if (lines.length < 2) { setStatus('❌ Κενό αρχείο'); setParsing(false); return; }

      const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim());
      const rows = lines.slice(1).map(line => {
        const vals = line.match(/(".*?"|[^,]+)/g) || line.split(',');
        const obj = {};
        headers.forEach((h,i) => { obj[h] = (vals[i]||'').replace(/"/g,'').trim(); });
        return obj;
      }).filter(r => r['Symbol'] && !r['Symbol'].includes('Downloaded'));

      // Parse premium to number - Barchart sends raw integer without $ or ,
      const parsePrem = p => {
        if (!p) return 0;
        const cleaned = String(p).replace(/[$,\s]/g,'');
        const n = parseFloat(cleaned);
        return isNaN(n) ? 0 : n;
      };

      // Parse size with comma handling
      const parseSize = s => {
        if (!s) return 0;
        return parseInt(String(s).replace(/,/g,'')) || 0;
      };

      // Sentiment logic
      const getSent = r => {
        const t = (r['Type']||'').trim();
        const s = (r['Side']||'').trim().toLowerCase();
        if (t==='Call' && s==='ask') return 'BULLISH';
        if (t==='Call' && s==='bid') return 'BEARISH';
        if (t==='Put' && s==='ask') return 'BEARISH';
        if (t==='Put' && s==='bid') return 'BULLISH';
        return 'NEUTRAL';
      };

      // Build summary
      const directional = rows.filter(r => ['ask','bid'].includes((r['Side']||'').toLowerCase()));
      const bull = directional.filter(r => getSent(r) === 'BULLISH');
      const bear = directional.filter(r => getSent(r) === 'BEARISH');
      const bullPrem = bull.reduce((s,r) => s + parsePrem(r['Premium']), 0);
      const bearPrem = bear.reduce((s,r) => s + parsePrem(r['Premium']), 0);
      const calls = rows.filter(r => r['Type']==='Call').length;
      const puts = rows.filter(r => r['Type']==='Put').length;

      // Top symbols
      const symMap = {};
      rows.forEach(r => {
        const sym = r['Symbol'];
        if (!symMap[sym]) symMap[sym] = { total:0, calls:0, puts:0, bull:0, bear:0 };
        symMap[sym].total += parsePrem(r['Premium']);
        if (r['Type']==='Call') symMap[sym].calls++;
        else symMap[sym].puts++;
        const sent = getSent(r);
        if (sent==='BULLISH') symMap[sym].bull += parsePrem(r['Premium']);
        if (sent==='BEARISH') symMap[sym].bear += parsePrem(r['Premium']);
      });
      const topSyms = Object.entries(symMap).sort((a,b)=>b[1].total-a[1].total).slice(0,8);

      // High conviction — use mapped data after parsing
      const hcMapped = rows.map(r => {
        const prem = parsePrem(r['Premium']);
        const side = (r['Side']||'mid').toLowerCase();
        return {
          ticker_symbol: r['Symbol'],
          put_call: r['Type']==='Put'?'PUT':'CALL',
          side: side.toUpperCase(),
          strike_price: parseFloat(r['Strike']||0),
          expiry_date: (r['Expires']||'').slice(0,10),
          dte: parseInt(r['DTE']||0),
          total_premium: prem,
          open_interest: parseSize(r['Open Int']),
          volume: parseSize(r['Volume']),
          size: parseSize(r['Size']),
          delta: parseFloat(r['Delta']||0),
          sentiment: getSent(r),
        };
      }).filter(r => r.ticker_symbol && !r.ticker_symbol.startsWith('Downloaded'));

      const hc = hcMapped
        .filter(r => ['ASK','BID'].includes(r.side) && r.total_premium > 5000000)
        .sort((a,b) => b.total_premium - a.total_premium)
        .slice(0,15);

      const sum = { rows: rows.length, calls, puts, bullPrem, bearPrem, ratio: bullPrem/(bearPrem||1), topSyms, hc, filename };
      setSummary(sum);
      setParsedRows(rows);

      // Map to flowTrades format — Barchart field names exact
      const mapped = rows.map(r => {
        const prem = parsePrem(r['Premium']);
        const oi = parseSize(r['Open Int']);
        const sz = parseSize(r['Size']);
        const delta = parseFloat(r['Delta']||0);
        const side = (r['Side']||'mid').toLowerCase();
        const type = r['Type'] === 'Put' ? 'PUT' : 'CALL';
        const sent = getSent(r);
        return {
          ticker_symbol: r['Symbol'] || '',
          put_call: type,
          // Critical tri-state mapping: ASK=true, BID=false, MID/unknown=null
          is_ask_side: side === 'ask' ? true : side === 'bid' ? false : null,
          execution_side: side === 'ask' ? 'ASK' : side === 'bid' ? 'BID' : side === 'mid' ? 'MID' : 'UNKNOWN',
          strike_price: parseFloat(r['Strike']||0),
          expiry_date: (r['Expires']||'').slice(0,10),
          total_premium: prem,
          dte: parseInt(r['DTE']||0),
          open_interest: oi,
          sentiment: sent,
          side: side.toUpperCase(),
          delta: delta,
          iv: r['IV']||'',
          size: sz,
          code: r['Code']||'',
          transaction_code: r['Code']||'',
          source: 'BARCHART_CSV',
          volume: parseSize(r['Volume']),
          trade_price: parseFloat(r['Trade']||0),
        };
      }).filter(r => r.ticker_symbol && r.ticker_symbol !== 'Symbol');

      onImport(mapped);
      setStatus(`✅ ${rows.length} trades · ${filename}`);
      onAddAlert('info', `📥 CSV: ${rows.length} trades φορτώθηκαν — ${filename}`);
    } catch(err) {
      setStatus('❌ ' + err.message);
    }
    setParsing(false);
  }

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => parseCSV(ev.target.result, file.name);
    reader.readAsText(file);
    e.target.value = '';
  }

  function handleDrop(e) {
    e.preventDefault();
    setDragging(false);
    const file = e.dataTransfer.files[0];
    if (!file || !file.name.endsWith('.csv')) { setStatus('❌ Μόνο .csv αρχεία'); return; }
    const reader = new FileReader();
    reader.onload = ev => parseCSV(ev.target.result, file.name);
    reader.readAsText(file);
  }

  async function analyzeWithClaude() {
    if (!parsedRows.length) return;
    setAiLoading(true);
    setAiAnalysis('');
    try {
      const s = summary;
      const fmtM = v => `$${(v/1e6).toFixed(1)}M`;
      const topSymsStr = s.topSyms.map(([sym,d]) =>
        `${sym}: total=${fmtM(d.total)} calls=${d.calls} puts=${d.puts} bull=${fmtM(d.bull)} bear=${fmtM(d.bear)}`
      ).join('\n');
      const hcStr = s.hc.map(r => {
        const sym = r.ticker_symbol || '?';
        const type = r.put_call || '?';
        const side = r.side || '?';
        const strike = r.strike_price != null ? `$${r.strike_price}` : '?';
        const exp = r.expiry_date || '?';
        const dte = r.dte != null ? r.dte : '?';
        const prem = r.total_premium ? fmtM(r.total_premium) : '?';
        const delta = r.delta != null ? r.delta.toFixed(2) : '?';
        const sent = r.sentiment || '?';
        const sz = r.size ? r.size.toLocaleString() : '?';
        const oi = r.open_interest ? r.open_interest.toLocaleString() : '?';
        const vol = r.volume ? r.volume.toLocaleString() : '?';
        return `${sym} ${type} ${side} strike=${strike} exp=${exp} DTE=${dte} prem=${prem} size=${sz} OI=${oi} vol=${vol} delta=${delta} → ${sent}`;
      }).join('\n');

      const prompt = `Είσαι senior options flow analyst. Ανάλυσε αυτό το Barchart Options Flow CSV για σήμερα:

ΣΥΝΟΨΗ:
- Σύνολο trades: ${s.rows}
- Calls: ${s.calls} | Puts: ${s.puts}
- Bull premium (directional): ${fmtM(s.bullPrem)}
- Bear premium (directional): ${fmtM(s.bearPrem)}
- Bull/Bear ratio: ${s.ratio.toFixed(2)}x

TOP SYMBOLS ΑΠΟ PREMIUM:
${topSymsStr}

HIGH CONVICTION TRADES (ask/bid side, >$5M):
${hcStr}

Παράγε ΠΛΗΡΗ ανάλυση στα ελληνικά:

🚨 ΑΣΥΝΗΘΙΣΤΗ ΔΡΑΣΤΗΡΙΟΤΗΤΑ
Τα 3 πιο σημαντικά signals με εξήγηση γιατί ξεχωρίζουν.

📊 MACRO SENTIMENT
Bull ή Bear σήμερα; Ποιοι sectors κυριαρχούν;

🎯 TOP TRADE SETUPS (2-3)
Συγκεκριμένα: ticker, direction, entry zone, stop, target, γιατί.

⚡ ΣΧΕΤΙΚΑ ΜΕ SOXL/SOXS/NAIL
Αν υπάρχουν στο flow — τι δείχνουν; Αν όχι — τι σημαίνει η απουσία τους;

⚠️ RISKS
Τι μπορεί να πάει λάθος σήμερα;

Να είσαι bold, συγκεκριμένος, με αριθμούς.`;

      const result = await callClaude(prompt, 8000);
      setAiAnalysis(result);
      onAddAlert('div', '🤖 Claude ανέλυσε το CSV — ' + now_gr());
    } catch(e) {
      setAiAnalysis('❌ Error: ' + e.message);
    }
    setAiLoading(false);
  }

  const fmtM = v => v >= 1e6 ? `$${(v/1e6).toFixed(1)}M` : `$${(v/1000).toFixed(0)}K`;

  return (
    <div>
      {/* DROP ZONE */}
      <div
        ref={dropRef}
        onDragOver={e=>{e.preventDefault();setDragging(true);}}
        onDragLeave={()=>setDragging(false)}
        onDrop={handleDrop}
        style={{
          border: `2px dashed ${dragging ? 'var(--green)' : summary ? 'var(--amber)' : 'var(--border2)'}`,
          borderRadius:4, padding:'14px 16px', marginBottom:10, textAlign:'center',
          background: dragging ? '#001a0a' : summary ? '#1a0f00' : 'transparent',
          transition:'all .15s', cursor:'pointer'
        }}
        onClick={() => document.getElementById('csvInput').click()}
      >
        <input id="csvInput" type="file" accept=".csv" onChange={handleFile} style={{display:'none'}}/>
        {parsing ? (
          <div style={{color:'var(--amber)',fontSize:10}}>⟳ Επεξεργασία...</div>
        ) : summary ? (
          <div>
            <div style={{fontSize:10,color:'var(--green)',fontWeight:700,marginBottom:4}}>✅ {summary.filename}</div>
            <div style={{fontSize:9,color:'var(--muted)'}}>
              {summary.rows} trades · {summary.calls} calls / {summary.puts} puts · Drag νέο για αντικατάσταση
            </div>
          </div>
        ) : (
          <div>
            <div style={{fontSize:11,color:'var(--muted)',marginBottom:3}}>📥 Drag & Drop CSV εδώ</div>
            <div style={{fontSize:9,color:'var(--dim)'}}>ή κλικ για επιλογή · Barchart Options Flow CSV</div>
          </div>
        )}
        {status && !summary && <div style={{fontSize:9,color:'var(--red)',marginTop:4}}>{status}</div>}
      </div>

      {/* SUMMARY CARDS */}
      {summary && (
        <div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginBottom:10}}>
            {[
              { label:'TRADES', value:summary.rows, color:'var(--text)' },
              { label:'CALLS/PUTS', value:`${summary.calls}/${summary.puts}`, color:'var(--text)' },
              { label:'BULL PREM', value:fmtM(summary.bullPrem), color:'var(--green)' },
              { label:'BEAR PREM', value:fmtM(summary.bearPrem), color:'var(--red)' },
            ].map((c,i) => (
              <div key={i} style={{background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:3,padding:'6px 8px',textAlign:'center'}}>
                <div style={{fontSize:7,color:'var(--muted)',letterSpacing:'.1em'}}>{c.label}</div>
                <div style={{fontSize:12,fontWeight:700,color:c.color,marginTop:2}}>{c.value}</div>
              </div>
            ))}
          </div>

          {/* RATIO BAR */}
          <div style={{marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:8,color:'var(--muted)',marginBottom:3}}>
              <span style={{color:'var(--green)'}}>BULL {fmtM(summary.bullPrem)}</span>
              <span style={{color:summary.ratio>1?'var(--green)':'var(--red)',fontWeight:700}}>{summary.ratio.toFixed(2)}x {summary.ratio>1?'BULL':'BEAR'}</span>
              <span style={{color:'var(--red)'}}>BEAR {fmtM(summary.bearPrem)}</span>
            </div>
            <div style={{height:5,background:'var(--border2)',borderRadius:3,overflow:'hidden'}}>
              <div style={{
                height:'100%',
                width: Math.min(100, (summary.bullPrem/(summary.bullPrem+summary.bearPrem))*100) + '%',
                background: summary.ratio>1 ? 'var(--green)' : 'var(--red)',
                borderRadius:3
              }}/>
            </div>
          </div>

          {/* TOP SYMBOLS */}
          <div style={{marginBottom:10}}>
            <div className="section-lbl">TOP SYMBOLS</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {summary.topSyms.slice(0,8).map(([sym,d],i) => {
                const isBull = d.bull > d.bear;
                return (
                  <div key={i} style={{
                    background:'var(--bg2)',border:`1px solid ${isBull?'#003318':'#330000'}`,
                    borderRadius:3,padding:'4px 8px',fontSize:9
                  }}>
                    <span style={{color:'var(--amber)',fontWeight:700}}>{sym}</span>
                    <span style={{color:'var(--muted)',marginLeft:4}}>{fmtM(d.total)}</span>
                    <span style={{color:isBull?'var(--green)':'var(--red)',marginLeft:4,fontSize:8}}>{isBull?'▲BULL':'▼BEAR'}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* AI BUTTON */}
          <button
            className="btn btn-ai"
            onClick={analyzeWithClaude}
            disabled={aiLoading || !window._CLAUDE_KEY}
            style={{width:'100%',padding:'8px',fontSize:10,letterSpacing:'.1em',marginBottom:10}}
          >
            {aiLoading ? '⟳ Claude αναλύει...' :
             !window._CLAUDE_KEY ? '⚠ Χρειάζεται Claude API key (⚙️ Settings)' :
             '🤖 ΑΝΑΛΥΣΗ ΜΕ CLAUDE AI'}
          </button>

          {/* AI OUTPUT */}
          {aiLoading && (
            <div className="ai-loading">
              <div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/>
              <span>Claude διαβάζει {summary.rows} options trades...</span>
            </div>
          )}
          {aiAnalysis && (
            <div className="ai-output" style={{maxHeight:500,overflowY:'auto'}}>{aiAnalysis}</div>
          )}
        </div>
      )}
    </div>
  );
}

function Settings({ apiStatus, onKeysChanged }) {
  const [activeSettingsTab, setActiveSettingsTab] = useState('CLAUDE');
  const [tdKey, setTdKey] = useState(window._TD_KEY || '');
  const [claudeKey, setClaudeKey] = useState(window._CLAUDE_KEY || '');
  const [openaiKey, setOpenaiKey] = useState(window._OPENAI_KEY || '');
  const [claudeModel, setClaudeModel] = useState(window._CLAUDE_MODEL || 'claude-sonnet-4-6');
  const [openaiModel, setOpenaiModel] = useState(window._OPENAI_MODEL || 'gpt-5.2');
  const [saved, setSaved] = useState(false);
  const [testState, setTestState] = useState({ provider:'', status:'', message:'' });

  function save() {
    window._TD_KEY = tdKey.trim();
    window._CLAUDE_KEY = claudeKey.trim();
    window._OPENAI_KEY = openaiKey.trim();
    window._CLAUDE_MODEL = claudeModel.trim() || 'claude-sonnet-4-6';
    window._OPENAI_MODEL = openaiModel.trim() || 'gpt-5.2';
    try {
      sessionStorage.setItem('etf_claude_key', window._CLAUDE_KEY);
      sessionStorage.setItem('etf_openai_key', window._OPENAI_KEY);
      localStorage.setItem('etf_claude_model', window._CLAUDE_MODEL);
      localStorage.setItem('etf_openai_model', window._OPENAI_MODEL);
    } catch (_) {}
    onKeysChanged?.({
      td: !!window._TD_KEY,
      claude: !!window._CLAUDE_KEY,
      openai: !!window._OPENAI_KEY,
    });
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  function clearSessionKeys() {
    window._CLAUDE_KEY = '';
    window._OPENAI_KEY = '';
    setClaudeKey('');
    setOpenaiKey('');
    try {
      sessionStorage.removeItem('etf_claude_key');
      sessionStorage.removeItem('etf_openai_key');
    } catch (_) {}
    onKeysChanged?.({ td: !!window._TD_KEY, claude:false, openai:false });
  }

  async function testProvider(provider) {
    save();
    setTestState({provider,status:'loading',message:'Έλεγχος σύνδεσης...'});
    try {
      const result = provider === 'CLAUDE'
        ? await callClaude('Απάντησε μόνο: CLAUDE_OK', 40)
        : await callOpenAI('Απάντησε μόνο: OPENAI_OK', 180, 'Return only the requested connection-test token.');
      setTestState({provider,status:'ok',message:result.slice(0,120)});
    } catch (error) {
      setTestState({provider,status:'error',message:error.message});
    }
  }

  const statusCards = [
    { label:'TWELVE DATA', ok: !!tdKey || apiStatus.td, note: (!!tdKey || apiStatus.td) ? '✓ ΕΝΕΡΓΟ' : '✗ ΟΧΙ KEY' },
    { label:'CLAUDE MAIN', ok: !!claudeKey || apiStatus.claude, note: (!!claudeKey || apiStatus.claude) ? '✓ ΚΥΡΙΟΣ AGENT' : '✗ ΟΧΙ KEY' },
    { label:'OPENAI 2nd OPINION', ok: !!openaiKey || apiStatus.openai, note: (!!openaiKey || apiStatus.openai) ? '✓ ΔΕΥΤΕΡΟΣ AGENT' : '✗ ΟΧΙ KEY' },
    { label:'BARCHART', ok: true, note:'CSV IMPORT ✓' },
  ];

  const inputStyle = {width:'100%',background:'var(--bg)',border:'1px solid var(--border2)',color:'var(--text)',fontFamily:'var(--font)',fontSize:11,padding:'7px 10px',borderRadius:2,outline:'none'};

  return (
    <div style={{maxWidth:760}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:16}}>
        {statusCards.map((s,i) => (
          <div key={i} style={{background:'var(--bg2)',border:`1px solid ${s.ok?'#003318':'#330000'}`,borderRadius:3,padding:'10px 8px',textAlign:'center'}}>
            <div style={{fontSize:8,color:'var(--muted)',marginBottom:4}}>{s.label}</div>
            <div style={{fontSize:10,color:s.ok?'var(--green)':'var(--red)',fontWeight:700}}>{s.note}</div>
          </div>
        ))}
      </div>

      <div style={{display:'flex',gap:6,borderBottom:'1px solid var(--border2)',marginBottom:12}}>
        {[
          ['CLAUDE','🤖 CLAUDE MAIN'],
          ['OPENAI','🧠 CHATGPT 2nd OPINION'],
          ['DATA','📊 DATA / SECURITY'],
        ].map(([key,label]) => (
          <button key={key} className={`btn ${activeSettingsTab===key?'btn-primary':''}`} onClick={()=>setActiveSettingsTab(key)} style={{borderBottomLeftRadius:0,borderBottomRightRadius:0}}>{label}</button>
        ))}
      </div>

      {activeSettingsTab === 'CLAUDE' && (
        <div style={{background:'var(--bg2)',border:'1px solid var(--purple)',borderRadius:4,padding:'14px 16px',marginBottom:12}}>
          <div className="stitle" style={{color:'var(--purple)'}}>CLAUDE — ΚΥΡΙΟΣ OPTIONS FLOW ANALYST</div>
          <div style={{display:'grid',gap:9}}>
            <div>
              <div style={{fontSize:9,color:'var(--muted)',marginBottom:4}}>ANTHROPIC API KEY</div>
              <input type="password" value={claudeKey} onChange={e=>setClaudeKey(e.target.value)} placeholder="sk-ant-api03-..." style={inputStyle}/>
            </div>
            <div>
              <div style={{fontSize:9,color:'var(--muted)',marginBottom:4}}>CLAUDE MODEL</div>
              <input value={claudeModel} onChange={e=>setClaudeModel(e.target.value)} placeholder="claude-sonnet-4-6" style={inputStyle}/>
            </div>
            <div style={{fontSize:8,color:'var(--dim)',lineHeight:1.7}}>Ο Claude εκτελεί την κύρια ανάλυση και, όταν υπάρχει OpenAI key, την τελική σύνθεση των δύο ανεξάρτητων γνωμών.</div>
            <div><button className="btn btn-ai" onClick={()=>testProvider('CLAUDE')}>TEST CLAUDE</button></div>
          </div>
        </div>
      )}

      {activeSettingsTab === 'OPENAI' && (
        <div style={{background:'var(--bg2)',border:'1px solid var(--cyan)',borderRadius:4,padding:'14px 16px',marginBottom:12}}>
          <div className="stitle" style={{color:'var(--cyan)'}}>OPENAI / CHATGPT — ΑΝΕΞΑΡΤΗΤΗ ΔΕΥΤΕΡΗ ΓΝΩΜΗ</div>
          <div style={{display:'grid',gap:9}}>
            <div>
              <div style={{fontSize:9,color:'var(--muted)',marginBottom:4}}>OPENAI API KEY</div>
              <input type="password" value={openaiKey} onChange={e=>setOpenaiKey(e.target.value)} placeholder="sk-proj-..." style={inputStyle}/>
            </div>
            <div>
              <div style={{fontSize:9,color:'var(--muted)',marginBottom:4}}>OPENAI MODEL</div>
              <input value={openaiModel} onChange={e=>setOpenaiModel(e.target.value)} placeholder="gpt-5.2" style={inputStyle}/>
            </div>
            <div style={{fontSize:8,color:'var(--dim)',lineHeight:1.7}}>Το OpenAI agent λαμβάνει τα ίδια deterministic δεδομένα, αλλά όχι την πρώτη απάντηση του Claude. Οι κλήσεις περνούν από /.netlify/functions/openai-proxy. Μπορείς να βάλεις key εδώ ή να χρησιμοποιήσεις το OPENAI_API_KEY του Netlify.</div>
            <div><button className="btn" onClick={()=>testProvider('OPENAI')} style={{borderColor:'var(--cyan)',color:'var(--cyan)'}}>TEST OPENAI</button></div>
          </div>
        </div>
      )}

      {activeSettingsTab === 'DATA' && (
        <div>
          <div style={{background:'var(--bg2)',border:'1px solid var(--amber)',borderRadius:4,padding:'14px 16px',marginBottom:12}}>
            <div className="stitle" style={{color:'var(--amber)'}}>TWELVE DATA</div>
            <input type="password" value={tdKey} onChange={e=>setTdKey(e.target.value)} placeholder="Twelve Data key" style={inputStyle}/>
          </div>
          <div style={{background:'#1a0000',border:'1px solid var(--red)',borderRadius:4,padding:'12px 14px',fontSize:9,color:'var(--muted)',lineHeight:1.8,marginBottom:12}}>
            <b style={{color:'var(--red)'}}>SECURITY:</b> Οι OpenAI κλήσεις περνούν πλέον από Netlify Function. Μπορείς είτε να εισαγάγεις key στο tab (κρατείται στο sessionStorage και στέλνεται μόνο στη δική σου function) είτε, προτιμότερα, να ορίσεις OPENAI_API_KEY στα Netlify Environment Variables και να αφήσεις το πεδίο κενό.
          </div>
          <button className="btn" onClick={clearSessionKeys}>🗑 CLEAR SESSION AI KEYS</button>
        </div>
      )}

      <div style={{display:'flex',alignItems:'center',gap:8,margin:'12px 0'}}>
        <button className="btn btn-primary" onClick={save}>{saved ? '✓ ΑΠΟΘΗΚΕΥΤΗΚΑΝ' : '💾 SAVE SETTINGS'}</button>
        <span style={{fontSize:8,color:'var(--dim)'}}>AI keys: μόνο για το τρέχον tab · Models: αποθηκεύονται στη συσκευή</span>
      </div>

      {testState.status && (
        <div style={{background:'var(--bg2)',border:`1px solid ${testState.status==='ok'?'var(--green)':testState.status==='error'?'var(--red)':'var(--amber)'}`,borderRadius:3,padding:'9px 11px',fontSize:9,color:'var(--text)',marginBottom:12}}>
          {testState.status==='loading'?'⟳ ':testState.status==='ok'?'✓ ':'❌ '}{testState.provider}: {testState.message}
        </div>
      )}

      <div style={{background:'var(--bg2)',border:'1px solid var(--green)',borderRadius:4,padding:'14px 16px'}}>
        <div className="stitle" style={{color:'var(--green)'}}>📊 BARCHART PREMIER — Κύρια πηγή Options Flow</div>
        <div style={{fontSize:9,color:'var(--muted)',lineHeight:2}}>
          <b style={{color:'var(--text)'}}>Options Flow CSV</b> → Import στο OPTIONS FLOW tab.<br/>
          Προτεινόμενο φίλτρο: <span style={{color:'var(--amber)'}}>Min Premium $10,000</span> · Type All · ETF universe.
        </div>
      </div>
    </div>
  );
}

function Notepad() {
  const [notes, setNotes] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('terminal_notes') || '[]');
    } catch {
      return [{ id: Date.now(), title: 'Πρώτη Σημείωση', content: '📝 Γράψε ό,τι θέλεις εδώ...', date: new Date().toLocaleDateString('el-GR'), pinned: false }];
    }
  });
  const [activeNote, setActiveNote] = useState(0);
  const [search, setSearch] = useState('');
  const saveTimer = useRef(null);

  useEffect(() => {
    localStorage.setItem('terminal_notes', JSON.stringify(notes));
  }, [notes]);

  function newNote(template = '') {
    const note = {
      id: Date.now(),
      title: 'Νέα Σημείωση',
      content: template || '',
      date: new Date().toLocaleDateString('el-GR'),
      pinned: false
    };
    setNotes(n => [note, ...n]);
    setActiveNote(0);
  }

  function updateContent(val) {
    setNotes(n => n.map((note, i) => {
      if (i !== activeNote) return note;
      // Auto-extract title from first line
      const firstLine = val.split('\n')[0].replace(/^[📋📅👁💡📝#*\s━-]+/, '').trim();
      return { ...note, content: val, title: firstLine || note.title, date: new Date().toLocaleDateString('el-GR') };
    }));
  }

  function deleteNote(i) {
    if (notes.length === 1) return;
    setNotes(n => n.filter((_, idx) => idx !== i));
    setActiveNote(Math.max(0, activeNote - 1));
  }

  function togglePin(i) {
    setNotes(n => n.map((note, idx) => idx === i ? { ...note, pinned: !note.pinned } : note));
  }

  const filtered = notes.filter(n =>
    !search || n.title.toLowerCase().includes(search.toLowerCase()) || n.content.toLowerCase().includes(search.toLowerCase())
  );

  const sorted = [...filtered].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  const current = notes[activeNote];

  return (
    <div style={{ display: 'grid', gridTemplateColumns: '220px 1fr', gap: 8, minHeight: 500 }}>
      {/* LEFT — note list */}
      <div style={{ borderRight: '1px solid var(--border2)', paddingRight: 8 }}>
        {/* Search */}
        <input
          placeholder="🔍 Αναζήτηση..."
          value={search}
          onChange={e => setSearch(e.target.value)}
          style={{ width: '100%', background: 'var(--bg2)', border: '1px solid var(--border2)', color: 'var(--text)', fontFamily: 'var(--font)', fontSize: 10, padding: '5px 8px', borderRadius: 2, outline: 'none', marginBottom: 7 }}
        />

        {/* Templates */}
        <div style={{ marginBottom: 7 }}>
          <div className="section-lbl">TEMPLATES</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4 }}>
            {NOTE_TEMPLATES.map((t, i) => (
              <button key={i} className="btn" style={{ fontSize: 8, padding: '2px 6px' }} onClick={() => newNote(t.text)}>
                + {t.label}
              </button>
            ))}
          </div>
        </div>

        <button className="btn btn-primary" style={{ width: '100%', marginBottom: 8, fontSize: 9 }} onClick={() => newNote()}>
          + ΝΕΑ ΣΗΜΕΙΩΣΗ
        </button>

        <div className="divider" />

        {/* Note list */}
        <div style={{ maxHeight: 420, overflowY: 'auto' }}>
          {sorted.length === 0 && <div style={{ fontSize: 9, color: 'var(--dim)', padding: '8px 0' }}>Δεν βρέθηκαν σημειώσεις.</div>}
          {sorted.map((note, i) => {
            const realIdx = notes.indexOf(note);
            const isActive = realIdx === activeNote;
            return (
              <div
                key={note.id}
                onClick={() => setActiveNote(realIdx)}
                style={{
                  padding: '7px 8px', borderRadius: 3, marginBottom: 3, cursor: 'pointer',
                  background: isActive ? '#1a0f00' : 'transparent',
                  border: `1px solid ${isActive ? 'var(--amber)' : 'transparent'}`,
                  transition: 'all .1s'
                }}
              >
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div style={{ fontSize: 10, color: isActive ? 'var(--amber)' : 'var(--text)', fontWeight: isActive ? 700 : 400, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 130 }}>
                    {note.pinned ? '📌 ' : ''}{note.title || 'Χωρίς τίτλο'}
                  </div>
                  <div style={{ display: 'flex', gap: 3 }}>
                    <button onClick={e => { e.stopPropagation(); togglePin(realIdx); }}
                      style={{ background: 'transparent', border: 'none', color: note.pinned ? 'var(--amber)' : 'var(--dim)', cursor: 'pointer', fontSize: 10, padding: 0 }}>
                      📌
                    </button>
                    <button onClick={e => { e.stopPropagation(); deleteNote(realIdx); }}
                      style={{ background: 'transparent', border: 'none', color: 'var(--dim)', cursor: 'pointer', fontSize: 10, padding: 0 }}>
                      ×
                    </button>
                  </div>
                </div>
                <div style={{ fontSize: 8, color: 'var(--dim)', marginTop: 2 }}>{note.date}</div>
                <div style={{ fontSize: 9, color: 'var(--muted)', marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {note.content.split('\n').find(l => l.trim() && !l.includes('━') && l !== note.title) || '—'}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* RIGHT — editor */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {current ? (
          <>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ fontSize: 9, color: 'var(--muted)' }}>
                {current.pinned ? '📌 ' : ''}{current.date} · {notes.length} σημειώσεις · αυτόματη αποθήκευση
              </div>
              <div style={{ display: 'flex', gap: 5 }}>
                <button className="btn" style={{ fontSize: 9 }} onClick={() => {
                  navigator.clipboard?.writeText(current.content);
                }}>📋 Copy</button>
                <button className="btn" style={{ fontSize: 9 }} onClick={() => {
                  const blob = new Blob([current.content], { type: 'text/plain' });
                  const a = document.createElement('a');
                  a.href = URL.createObjectURL(blob);
                  a.download = (current.title || 'note') + '.txt';
                  a.click();
                }}>⬇ Export</button>
              </div>
            </div>
            <textarea
              value={current.content}
              onChange={e => updateContent(e.target.value)}
              spellCheck={false}
              style={{
                flex: 1, minHeight: 460, width: '100%',
                background: 'var(--bg2)', border: '1px solid var(--border2)',
                color: 'var(--text)', fontFamily: 'var(--font)', fontSize: 11,
                padding: '12px 14px', borderRadius: 3, outline: 'none',
                resize: 'none', lineHeight: 1.8,
                caretColor: 'var(--amber)'
              }}
              onFocus={e => e.target.style.borderColor = 'var(--amber)'}
              onBlur={e => e.target.style.borderColor = 'var(--border2)'}
            />
            <div style={{ fontSize: 8, color: 'var(--dim)', textAlign: 'right' }}>
              {current.content.length} χαρακτήρες · {current.content.split('\n').length} γραμμές
            </div>
          </>
        ) : (
          <div style={{ fontSize: 10, color: 'var(--dim)', padding: '40px 0', textAlign: 'center' }}>
            Επίλεξε σημείωση ή δημιούργησε νέα.
          </div>
        )}
      </div>
    </div>
  );
}

// ==================== OPTIONS FLOW INTELLIGENCE ====================
const FLOW_SIDE = Object.freeze({ ASK:'ASK', BID:'BID', MID:'MID', UNKNOWN:'UNKNOWN' });
const FLOW_DIRECTION = Object.freeze({ BULLISH:'BULLISH', BEARISH:'BEARISH', UNKNOWN:'UNKNOWN' });
const DEALER_GAMMA = Object.freeze({ SHORT:'SHORT_GAMMA', LONG:'LONG_GAMMA', UNKNOWN:'UNKNOWN' });
const clamp01 = value => Math.max(0, Math.min(1, Number(value) || 0));

function normalizeExecutionSide(trade) {
  const raw = String(trade.execution_side || trade.side || trade.action || trade.transaction_side || '').trim().toUpperCase();
  if (['ASK','BUY','BOUGHT'].includes(raw)) return FLOW_SIDE.ASK;
  if (['BID','SELL','SOLD'].includes(raw)) return FLOW_SIDE.BID;
  if (['MID','MIDDLE'].includes(raw)) return FLOW_SIDE.MID;
  if (trade.is_ask_side === true) return FLOW_SIDE.ASK;
  if (trade.is_ask_side === false) return FLOW_SIDE.BID;
  return FLOW_SIDE.UNKNOWN;
}

function normalizeTransactionType(code) {
  const value = String(code || '').toUpperCase().replace(/[^A-Z]/g,'');
  if (value.includes('BTO') || value.includes('BUYTOOPEN')) return 'BUY_TO_OPEN';
  if (value.includes('STO') || value.includes('SELLTOOPEN')) return 'SELL_TO_OPEN';
  if (value.includes('BTC') || value.includes('BUYTOCLOSE')) return 'BUY_TO_CLOSE';
  if (value.includes('STC') || value.includes('SELLTOCLOSE')) return 'SELL_TO_CLOSE';
  return 'UNKNOWN';
}

function classifyDirectionalFlow(optionType, side) {
  if (side === FLOW_SIDE.MID || side === FLOW_SIDE.UNKNOWN) return FLOW_DIRECTION.UNKNOWN;
  if (optionType === 'CALL' && side === FLOW_SIDE.ASK) return FLOW_DIRECTION.BULLISH;
  if (optionType === 'CALL' && side === FLOW_SIDE.BID) return FLOW_DIRECTION.BEARISH;
  if (optionType === 'PUT' && side === FLOW_SIDE.ASK) return FLOW_DIRECTION.BEARISH;
  if (optionType === 'PUT' && side === FLOW_SIDE.BID) return FLOW_DIRECTION.BULLISH;
  return FLOW_DIRECTION.UNKNOWN;
}

function classifyDealerGamma(side) {
  if (side === FLOW_SIDE.ASK) return DEALER_GAMMA.SHORT;
  if (side === FLOW_SIDE.BID) return DEALER_GAMMA.LONG;
  return DEALER_GAMMA.UNKNOWN;
}

function calculateAtmProximity(delta) {
  return clamp01(1 - Math.abs(Math.abs(delta) - 0.5) * 2);
}

function calculateDteWeight(dte) {
  return 1 / (1 + Math.max(0, dte) / 30);
}

function calculateConviction(side, transactionType, volOI) {
  if (![FLOW_SIDE.ASK, FLOW_SIDE.BID].includes(side)) return 0;
  const openingWeight = ['BUY_TO_OPEN','SELL_TO_OPEN'].includes(transactionType)
    ? 1
    : ['BUY_TO_CLOSE','SELL_TO_CLOSE'].includes(transactionType) ? 0.45 : 0.65;
  const unusualWeight = clamp01(Math.log10(1 + Math.max(0, volOI)) / 2);
  return clamp01(0.62 + 0.23 * openingWeight + 0.15 * unusualWeight);
}

function normalizeFlowTrade(raw, index) {
  const side = normalizeExecutionSide(raw);
  const optionType = String(raw.put_call || raw.option_type || raw.type || '').toUpperCase();
  const delta = Math.abs(parseFloat(raw.delta) || 0);
  const size = Math.max(0, Number(raw.size) || 0);
  const volume = Math.max(0, Number(raw.volume) || size || 0);
  const openInterest = Math.max(0, Number(raw.open_interest) || 0);
  const dte = Number.isFinite(Number(raw.dte)) ? Number(raw.dte) : -1;
  const premium = Math.max(0, Number(raw.total_premium || raw.premium) || 0);
  const volOI = openInterest > 0 ? volume / openInterest : volume > 0 ? volume : 0;
  const transactionType = normalizeTransactionType(raw.transaction_code || raw.code || raw.opening_action);
  const direction = classifyDirectionalFlow(optionType, side);
  const dealerGamma = classifyDealerGamma(side);
  const atmProximity = calculateAtmProximity(delta);
  const dteWeight = calculateDteWeight(dte);
  const deltaExposureShares = size * 100 * delta;
  const gammaImpactRaw = deltaExposureShares * atmProximity * dteWeight;
  const conviction = calculateConviction(side, transactionType, volOI);

  return {
    id: `${raw.ticker_symbol || raw.ticker || 'NA'}-${index}-${raw.expiry_date || raw.expiration || ''}-${raw.strike_price || raw.strike || ''}`,
    ticker: raw.ticker_symbol || raw.ticker || '—',
    optionType,
    side,
    direction,
    dealerGamma,
    transactionType,
    delta,
    size,
    volume,
    openInterest,
    volOI,
    premium,
    weightedPremium: premium * conviction,
    conviction,
    strike: Number(raw.strike_price || raw.strike) || 0,
    expiration: raw.expiry_date || raw.expiration || '—',
    dte,
    atmProximity,
    dteWeight,
    deltaExposureShares,
    gammaImpactRaw,
    gammaScore: 0,
    source: raw.source || 'UNKNOWN',
  };
}

function normalizeGammaScores(trades) {
  const knownImpacts = trades
    .filter(t => [FLOW_SIDE.ASK, FLOW_SIDE.BID].includes(t.side))
    .map(t => Math.log1p(t.gammaImpactRaw));
  const maxLogImpact = Math.max(1, ...knownImpacts);
  return trades.map(t => ({
    ...t,
    gammaScore: Math.round(100 * Math.log1p(t.gammaImpactRaw) / maxLogImpact),
  }));
}

function aggregateOptionsFlow(trades) {
  const totals = trades.reduce((acc, trade) => {
    acc.totalPremium += trade.premium;
    if (trade.direction === FLOW_DIRECTION.BULLISH) {
      acc.bullishWeighted += trade.weightedPremium;
      acc.knownPremium += trade.premium;
    } else if (trade.direction === FLOW_DIRECTION.BEARISH) {
      acc.bearishWeighted += trade.weightedPremium;
      acc.knownPremium += trade.premium;
    } else {
      acc.unknownPremium += trade.premium;
      acc.unknownCount += 1;
    }

    const gammaImpact = trade.gammaImpactRaw * trade.conviction;
    if (trade.dealerGamma === DEALER_GAMMA.SHORT) acc.shortGammaImpact += gammaImpact;
    if (trade.dealerGamma === DEALER_GAMMA.LONG) acc.longGammaImpact += gammaImpact;
    return acc;
  }, {
    totalPremium:0, knownPremium:0, unknownPremium:0, unknownCount:0,
    bullishWeighted:0, bearishWeighted:0,
    shortGammaImpact:0, longGammaImpact:0,
  });

  const directionalDenom = totals.bullishWeighted + totals.bearishWeighted;
  const directionBalance = directionalDenom > 0
    ? (totals.bullishWeighted - totals.bearishWeighted) / directionalDenom : 0;
  const gammaDenom = totals.shortGammaImpact + totals.longGammaImpact;
  const gammaBalance = gammaDenom > 0
    ? (totals.shortGammaImpact - totals.longGammaImpact) / gammaDenom : 0;

  const directionVerdict = directionalDenom === 0 ? 'UNKNOWN'
    : directionBalance > 0.15 ? 'BULLISH'
    : directionBalance < -0.15 ? 'BEARISH' : 'MIXED';
  const gammaVerdict = gammaDenom === 0 ? 'UNKNOWN'
    : gammaBalance > 0.15 ? 'AMPLIFYING'
    : gammaBalance < -0.15 ? 'SUPPRESSING' : 'MIXED';

  return {
    ...totals,
    directionBalance,
    gammaBalance,
    directionVerdict,
    gammaVerdict,
    knownSideCoverage: totals.totalPremium > 0 ? totals.knownPremium / totals.totalPremium : 0,
  };
}

function aggregateByTicker(trades) {
  const map = {};
  trades.forEach(t => {
    if (!map[t.ticker]) map[t.ticker] = {
      ticker:t.ticker, totalPremium:0, knownPremium:0, unknownPremium:0,
      bullishWeighted:0, bearishWeighted:0, shortGammaImpact:0, longGammaImpact:0,
      contracts:0,
    };
    const x = map[t.ticker];
    x.totalPremium += t.premium;
    x.contracts += t.size;
    if (t.direction === FLOW_DIRECTION.BULLISH) { x.bullishWeighted += t.weightedPremium; x.knownPremium += t.premium; }
    else if (t.direction === FLOW_DIRECTION.BEARISH) { x.bearishWeighted += t.weightedPremium; x.knownPremium += t.premium; }
    else x.unknownPremium += t.premium;
    const gammaImpact = t.gammaImpactRaw * t.conviction;
    if (t.dealerGamma === DEALER_GAMMA.SHORT) x.shortGammaImpact += gammaImpact;
    if (t.dealerGamma === DEALER_GAMMA.LONG) x.longGammaImpact += gammaImpact;
  });

  return Object.values(map).map(x => {
    const dirDen = x.bullishWeighted + x.bearishWeighted;
    const dirBal = dirDen ? (x.bullishWeighted - x.bearishWeighted) / dirDen : 0;
    const gammaDen = x.shortGammaImpact + x.longGammaImpact;
    const gammaBal = gammaDen ? (x.shortGammaImpact - x.longGammaImpact) / gammaDen : 0;
    return {
      ...x,
      direction: !dirDen ? 'UNKNOWN' : dirBal > 0.15 ? 'BULLISH' : dirBal < -0.15 ? 'BEARISH' : 'MIXED',
      gammaRegime: !gammaDen ? 'UNKNOWN' : gammaBal > 0.15 ? 'AMPLIFY' : gammaBal < -0.15 ? 'SUPPRESS' : 'MIXED',
      coverage: x.totalPremium ? x.knownPremium / x.totalPremium : 0,
      directionBalance: dirBal,
      gammaBalance: gammaBal,
    };
  }).sort((a,b) => b.totalPremium - a.totalPremium);
}

function analyzeOptionsFlow(rawTrades) {
  const normalized = (rawTrades || [])
    .map(normalizeFlowTrade)
    .filter(t => t.ticker !== '—' && ['CALL','PUT'].includes(t.optionType) && t.dte > 0 && t.delta >= 0 && t.delta <= 1);
  const trades = normalizeGammaScores(normalized)
    .sort((a,b) => (b.weightedPremium + b.gammaImpactRaw) - (a.weightedPremium + a.gammaImpactRaw));
  return {
    trades,
    knownTrades: trades.filter(t => t.direction !== FLOW_DIRECTION.UNKNOWN),
    unknownTrades: trades.filter(t => t.direction === FLOW_DIRECTION.UNKNOWN),
    summary: aggregateOptionsFlow(trades),
    tickers: aggregateByTicker(trades),
  };
}

function parseAgentJson(text) {
  if (!text) return null;
  const cleaned = String(text).replace(/```json/gi,'').replace(/```/g,'').trim();
  try { return JSON.parse(cleaned); } catch (_) {}
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start >= 0 && end > start) {
    try { return JSON.parse(cleaned.slice(start, end + 1)); } catch (_) {}
  }
  return null;
}

  const topDirectional = [...analysis.knownTrades]

      conviction:Number(t.conviction.toFixed(2)), delta:Number(t.delta.toFixed(3)),
      strike:t.strike, expiration:t.expiration, dte:t.dte,
    }));
  const topGamma = [...analysis.knownTrades]
    .sort((a,b) => b.gammaImpactRaw - a.gammaImpactRaw)
    .slice(0,24)
    .map(t => ({
      ticker:t.ticker, option:t.optionType, side:t.side,
      dealerGamma:t.dealerGamma, gammaScore:t.gammaScore,
      atmProximity:Number(t.atmProximity.toFixed(2)), dteWeight:Number(t.dteWeight.toFixed(2)),
      deltaExposureShares:Math.round(t.deltaExposureShares), premium:Math.round(t.premium),
    }));
  const prices = {};
  analysis.tickers.slice(0,20).forEach(t => {

    if (d?.price != null) prices[t.ticker] = { price:d.price, changePct:d.change, preMarketPct:d.preChange };

  return {
    generatedAt:new Date().toISOString(),
    methodology:{
      directional:'CALL ask bullish; CALL bid bearish; PUT ask bearish; PUT bid bullish; MID unknown',
      dealerGamma:'customer buy/ASK => likely dealer short gamma; customer sell/BID => likely dealer long gamma',
      gammaProxy:'size × 100 × |delta| × ATM proximity × DTE weight',
      weightedTotals:'premium × conviction; MID excluded from directional totals',

    tickerSummaries:analysis.tickers.slice(0,20),

    topGamma,
    currentPrices:prices,
  };
}

          </div>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,marginBottom:9}}>

            <AgentResultCard title="OPENAI / CHATGPT SECOND OPINION" accent="var(--cyan)" badge="INDEPENDENT" result={ai.openaiResult} raw={ai.openaiRaw} loading={ai.running&&!ai.openaiRaw&&!ai.openaiError} error={ai.openaiError}/>

            {ai.consensusError && <div style={{color:'var(--red)',fontSize:9}}>❌ {ai.consensusError}</div>}
            {ai.consensusResult && <div style={{fontSize:9,lineHeight:1.8}}>

              {(ai.consensusResult.agreed_points||[]).map((x,i)=><div key={i}>✓ {x}</div>)}
              {(ai.consensusResult.disagreements||[]).length>0&&<div style={{marginTop:6,color:'var(--amber)'}}>Διαφωνίες: {(ai.consensusResult.disagreements||[]).join(' · ')}</div>}
              {(ai.consensusResult.decision_support||[]).map((x,i)=><div key={`d${i}`} style={{marginTop:5}}>→ {x}</div>)}
              {ai.consensusResult.do_not_overinterpret&&<div style={{marginTop:7,color:'var(--muted)'}}>⚠ {ai.consensusResult.do_not_overinterpret}</div>}
            </div>}
            {!ai.consensusResult && ai.consensusRaw && <div className="ai-output">{ai.consensusRaw}</div>}
          </div>}
        </div>
      )}
    </div>
  );
}

function App() {

  const [marketOpen, setMarketOpen] = useState(isMarketOpen());
  const [warnClose, setWarnClose] = useState(false);
  const [minsLeft, setMinsLeft] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const [tickers, setTickers] = useState(['SOXL','SOXS','NAIL','TQQQ','QQQ','SPY']);
  const [newTicker, setNewTicker] = useState('');
  const [tickerData, setTickerData] = useState({
    SOXL:{ price:171.65, change:3.85, vol:'15.05M', range:'158.87-175.48', putFlow:100, callFlow:0, signals:['DIVERGENCE','HIGH VOL'], type:'bull', preChange:-3.80 },
    SOXS:{ price:4.62, change:-3.85, vol:'183.06M', range:'4.50-4.99', putFlow:40, callFlow:60, signals:['HIGH VOL'], type:'bear', preChange:3.75 },
    NAIL:{ price:40.33, change:-9.97, vol:'2.1M', range:'37.5-44.5', putFlow:65, callFlow:35, signals:['BEAR FLOW','HIGH VOL'], type:'bull', preChange:0 },
    TQQQ:{ price:72.23, change:-5.48, vol:'45M', range:'68-75', putFlow:75, callFlow:25, signals:['BEAR FLOW'], type:'bull', preChange:0 },
    QQQ:{ price:708.39, change:-0.15, vol:'7.69M', range:'704.94-709.80', putFlow:60, callFlow:40, signals:[], type:'bull', preChange:0 },
    SPY:{ price:744.09, change:-0.48, vol:'7.59M', range:'742.64-744.91', putFlow:55, callFlow:45, signals:[], type:'bull', preChange:0 },
  });

  // Twelve Data live fetch
  const fetchLivePrices = useCallback(async (tickerList) => {
    const key = window._TD_KEY || TD_KEY;
    if (!key) return;
    try {
      const syms = tickerList.join(',');
      const r = await fetch(`https://api.twelvedata.com/quote?symbol=${syms}&apikey=${key}`);
      const data = await r.json();
      setTickerData(prev => {
        const updated = { ...prev };
        // If single ticker, API returns object directly; multiple returns object keyed by symbol
        const entries = tickerList.length === 1
          ? [[tickerList[0], data]]
          : Object.entries(data);
        entries.forEach(([sym, q]) => {
          if (!q || q.status === 'error' || !q.close) return;
          const price = parseFloat(q.close);
          const open = parseFloat(q.open);
          const high = parseFloat(q.high);
          const low = parseFloat(q.low);
          const prevClose = parseFloat(q.previous_close);
          const change = prevClose ? ((price - prevClose) / prevClose) * 100 : 0;
          const vol = q.volume ? (parseInt(q.volume) >= 1e6
            ? (parseInt(q.volume)/1e6).toFixed(2)+'M'
            : (parseInt(q.volume)/1e3).toFixed(0)+'K') : '—';
          // Detect divergence: price up but existing put flow > 70%
          const existing = prev[sym] || {};
          const sigs = [...(existing.signals||[]).filter(s=>!['LIVE','HIGH VOL','DIVERGENCE'].includes(s))];
          if (Math.abs(change) > 3) sigs.push('HIGH VOL');
          if (change > 1 && (existing.putFlow||0) > 70) sigs.push('DIVERGENCE');
          updated[sym] = {
            ...existing,
            price, change, vol,
            range: `${low.toFixed(2)}-${high.toFixed(2)}`,
            open, prevClose,
            signals: [...new Set(sigs)],
            liveUpdated: true,
          };
        });
        return updated;
      });
    } catch(e) {
      console.warn('Twelve Data fetch error:', e);
    }
  }, []);

  // Auto-fetch on mount and every 15 min
  useEffect(() => {
    const key = window._TD_KEY || TD_KEY;
    if (!key) return;
    fetchLivePrices(tickers);
    const interval = setInterval(() => fetchLivePrices(tickers), 15 * 60 * 1000);
    return () => clearInterval(interval);
  }, [tickers, fetchLivePrices]);
  const [flowTrades, setFlowTrades] = useState([
    { ticker_symbol:'SOXL', put_call:'PUT', side:'ASK', execution_side:'ASK', is_ask_side:true, strike_price:160, expiry_date:'2026-07-10', total_premium:64000, dte:2, open_interest:40 },
    { ticker_symbol:'SOXL', put_call:'PUT', side:'ASK', execution_side:'ASK', is_ask_side:true, strike_price:155, expiry_date:'2026-07-10', total_premium:41000, dte:2, open_interest:30 },
    { ticker_symbol:'SOXL', put_call:'PUT', side:'ASK', execution_side:'ASK', is_ask_side:true, strike_price:165, expiry_date:'2027-01-15', total_premium:398000, dte:191, open_interest:100 },
    { ticker_symbol:'SPY', put_call:'PUT', side:'ASK', execution_side:'ASK', is_ask_side:true, strike_price:730, expiry_date:'2026-08', total_premium:28000, dte:45, open_interest:500 },
    { ticker_symbol:'QQQ', put_call:'PUT', side:'ASK', execution_side:'ASK', is_ask_side:true, strike_price:695, expiry_date:'2026-08', total_premium:19000, dte:45, open_interest:300 },
    { ticker_symbol:'PLUG', put_call:'PUT', side:'ASK', execution_side:'ASK', is_ask_side:true, strike_price:2.50, expiry_date:'2026-08', total_premium:8000, dte:45, open_interest:200 },
  ]);
  const [trades, setTrades] = useState(() => {
    try { return JSON.parse(localStorage.getItem('trades_v3')||'[]'); } catch { return []; }
  });
  const [capital, setCapital] = useState(() => {
    const s = localStorage.getItem('capital_v3'); return s ? parseFloat(s) : 16;
  });
  const [alerts, setAlerts] = useState([
    { type:'div', time:'ΧΘΕΣ', msg:'⚡ SOXL DIVERGENCE: +3.23% price + 10 puts / 0 calls → BEARISH confirmed' },
    { type:'whale', time:'PRE-MKT', msg:'🐋 SOXL $398K put Jan-2027 — institutional θέση' },
    { type:'crit', time:'ΧΘΕΣ', msg:'🔴 Iran Hormuz event — SOXL -15% | SOXS +15%' },
  ]);
  const [apiStatus, setApiStatus] = useState({ td: !!TD_KEY, claude: !!window._CLAUDE_KEY, openai: !!window._OPENAI_KEY });
  const [lightMode, setLightMode] = useState(() => localStorage.getItem('lightMode') === 'true');
  useEffect(() => {
    document.body.classList.toggle('light', lightMode);
    localStorage.setItem('lightMode', lightMode);
  }, [lightMode]);
  function toggleLight() { setLightMode(m => !m); }

      setClockGR(now_gr());
      setClockET(now_et());
      setMarketOpen(isMarketOpen());
      const m = minsToClose();
      setMinsLeft(m);
      setWarnClose(m > 0 && m <= 20);
    }, 1000);
    return () => clearInterval(t);
  }, []);

    localStorage.setItem('trades_v3', JSON.stringify(trades));
    localStorage.setItem('capital_v3', capital.toString());
  }, [trades, capital]);

    setAlerts(a => [{ type, msg, time: now_gr() }, ...a.slice(0,19)]);

      `${trade.ticker} ${trade.dir}: ${trade.pnl>=0?'+':''}€${trade.pnl.toFixed(2)} (${(trade.pctChange*100).toFixed(1)}%)`);
  }

  function addTicker() {

    if (t && !tickers.includes(t)) {
      setTickers(prev => {

        // Fetch live price for new ticker
        const key = window._TD_KEY || TD_KEY;

        return updated;
      });
      setNewTicker('');
    }
  }

  async function refresh() {

    const key = window._TD_KEY || TD_KEY;

            <b style={{color:'var(--text)'}}>Insider/Congress</b> — Disclosed with delay, buying patterns often precede catalysts.
          </div>
        </div>
      );

      case 'premarket': return (
        <div>
          <div style={{fontSize:9,color:'var(--muted)',marginBottom:10}}>Pre-market data (14:00–16:30 GR) · Καθορίζει κατεύθυνση intraday</div>
          {['SOXL','SOXS','NAIL','QQQ','SPY'].map(t => {
            const d = tickerData[t];
            const pre = d?.preChange;
            return (
              <div key={t} className="pm-item">
                <div className="pm-tick">{t}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:8,color:'var(--muted)'}}>PRE-MKT CHANGE</div>
                  <div className={`pm-ch ${pre>0?'up':pre<0?'down':'neutral'}`}>{pre!=null?(pre>=0?'+':'')+fmt(pre,2)+'%':'—'}</div>
                </div>
                <div>
                  {pre > 1 && <span className="sp sp-bull">GAP UP</span>}
                  {pre < -1 && <span className="sp sp-bear">GAP DOWN</span>}
                  {pre != null && Math.abs(pre) <= 1 && <span className="sp sp-warn">NEUTRAL</span>}
                </div>
              </div>
            );
          })}
          <div className="divider"/>
          <div className="etoro-note">
            <span>⚠ CFD ΚΑΝΟΝΑΣ:</span> Μη ανοίγεις θέση &lt;30 λεπτά πριν κλείσιμο (22:30 GR).<br/>
            Spread eToro σε SOXL/SOXS: ~0.3-0.7% — μπαίνεις ήδη "κάτω".<br/>
            Overnight financing: ~0.05%/νύχτα — <span>ΠΟΤΕ overnight σε 3x ETF CFD.</span>
          </div>
        </div>
      );

      case 'bigmove': return <BigMoveDetector onAddAlert={addAlert}/>;

      case 'claude': return <ClaudeAnalysis tickerData={tickerData} flowTrades={flowTrades} onAddAlert={addAlert}/>;

      case 'scanner': return <BuffettScanner tdKey={TD_KEY}/>;

      case 'ai': return <AIPanel tickerData={tickerData} flowTrades={flowTrades}/>;

      case 'notes': return <Notepad/>;

      case 'settings': return <Settings apiStatus={apiStatus} onKeysChanged={setApiStatus}/>;

      default: return null;
    }
  }

  return (
    <div>
      <TopBar
        clockGR={clockGR} clockET={clockET} marketOpen={marketOpen}
        warnClose={warnClose} minsLeft={minsLeft}
        onRefresh={refresh} refreshing={refreshing} apiStatus={apiStatus}
        lightMode={lightMode} onToggleLight={toggleLight}
      />

      {/* TABS */}
      <div className="tabs">
        {TABS.map(t => (
          <div key={t.id} className={`tab ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</div>
        ))}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:6,padding:'0 12px'}}>
          <div className="add-row" style={{margin:0}}>
            <input placeholder="TQQQ, NVDA, AAPL…" value={newTicker}
              onChange={e=>setNewTicker(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&addTicker()}
              style={{width:160,fontSize:10,padding:'4px 8px'}}/>
            <button className="btn" onClick={addTicker}>+ ADD</button>
          </div>
        </div>
      </div>

      {/* MAIN */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:1,background:'var(--border)'}}>
        <div className="panel" style={{padding:12}}>
          <div className="ph">
            <div className="pt">{TABS.find(t=>t.id===tab)?.label}</div>
            <div style={{fontSize:9,color:'var(--muted)'}}>Updated {clockGR} · {marketOpen?'live':'closed'}</div>
          </div>
          {renderTab()}
        </div>
        <Sidebar
          capital={capital}
          trades={trades}
          onLogTrade={logTrade}
          alerts={alerts}
        />
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
